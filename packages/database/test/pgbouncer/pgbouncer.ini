; Transaction pooling with the settings Neon publishes for its pooler
; (https://neon.com/docs/connect/connection-pooling): pool_mode, max_client_conn,
; default_pool_size (0.9 x max_connections = 90 for PostgreSQL's default 100),
; max_prepared_statements and query_wait_timeout. Everything else is PgBouncer's default,
; which Neon does not publish: this is close to Neon's pooler, not Neon itself.
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = incision_pgb
pool_mode = transaction
max_client_conn = 10000
default_pool_size = 90
max_prepared_statements = 1000
query_wait_timeout = 120
