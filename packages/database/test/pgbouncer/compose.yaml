# Isolated PostgreSQL + PgBouncer for test/pgbouncer.db.test.ts and the pooled check script.
# Its own project, network and ports; never the shared test database (5433). Fake credentials.
#   docker compose -f packages/database/test/pgbouncer/compose.yaml up -d --wait
#   docker compose -f packages/database/test/pgbouncer/compose.yaml down -v
name: incision-pgbouncer-check

services:
  postgres:
    # PostgreSQL 17.11 (postgres:17-alpine on 9 October 2026)
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: incision_pgb
      POSTGRES_PASSWORD: pgbouncer_test_only
      POSTGRES_DB: incision_pgb
    ports:
      - "127.0.0.1:5451:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incision_pgb -d incision_pgb"]
      interval: 1s
      timeout: 3s
      retries: 30

  pgbouncer:
    # PgBouncer 1.26.0
    image: edoburu/pgbouncer@sha256:9c78945868a6a142c7fc40ccd843bbe5a606df163c7ffce4de70e0d628d696a2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "127.0.0.1:6451:6432"
