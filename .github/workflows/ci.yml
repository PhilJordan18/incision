name: CI

on:
  push:
    # main is checked by the Deploy workflow, which calls this one before deploying.
    branches-ignore: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so Deploy never waits on a CI run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pushes on work branches are cancelled; dev and main always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  checks:
    name: Lint, type check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: 1
    services:
      # Disposable PostgreSQL for database tests; never a production database.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: incision_test
          POSTGRES_PASSWORD: incision_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incision_test -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Reject JavaScript files (TECH-02)
        run: npm run check:no-js

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Migrations match the schema
        # drizzle-kit exits 0 even when generation fails or needs an interactive answer
        # (renames), so require its explicit "no changes" message and a clean folder.
        run: |
          output="$(npm run db:generate -w @incision/database 2>&1 < /dev/null)" || { echo "$output"; exit 1; }
          echo "$output"
          if ! grep -q "No schema changes, nothing to migrate" <<< "$output" \
            || [ -n "$(git status --porcelain -- packages/database/drizzle)" ]; then
            echo "::error::The Drizzle schema and the committed migrations disagree (run npm run db:generate -w @incision/database)."
            git status --porcelain -- packages/database/drizzle
            exit 1
          fi

      - name: Database tests (PostgreSQL 17)
        env:
          TEST_DATABASE_URL: postgresql://incision_test:incision_test_only@localhost:5432/postgres
        run: npm run test:db -w @incision/database

      - name: Build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright, production build)
        # Its own database on the service container, rebuilt and seeded with the demo
        # accounts by the test run; throwaway AUTH_SECRET and placeholder OAuth ids.
        env:
          E2E_DATABASE_URL: postgresql://incision_test:incision_test_only@localhost:5432/incision_e2e
        run: npm run test:e2e -w @incision/web

      - name: Keep the Playwright report of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
          # A re-run attempt replaces the report of the failed one.
          overwrite: true
