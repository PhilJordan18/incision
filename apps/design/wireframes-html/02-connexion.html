<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incision · Connexion et inscription</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&amp;family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05070D}
a{color:#5BD6FF}a:hover{color:#EEF2F7}
</style>
</head>
<body>

<div style="min-height: 900px; background: #05070D; color: #EEF2F7; font-family: Geist, 'Helvetica Neue', sans-serif; display: flex; flex-wrap: wrap">
  <aside style="flex: 1 1 520px; min-height: 900px; position: relative; overflow: hidden; background: radial-gradient(ellipse 60% 50% at 50% 45%, rgba(188, 4, 4, 0.28), rgba(5, 7, 13, 0) 70%), #08101E; border-right: 1px solid #22324D; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 48px; box-sizing: border-box">
    <a href="01-accueil.html" style="display: flex; align-items: center; gap: 12px"><img src="../logo/ico-red.svg" alt="" style="width: 36px; height: 36px"><img src="../logo/wm-white.svg" alt="Incision, retour à l'accueil" style="width: 116px; height: 25px"></a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 28px">
      <svg width="360" height="360" viewBox="0 0 360 360" fill="none" aria-hidden="true" style="position: absolute; left: 50%; top: 50%; margin: -220px 0 0 -180px"><g stroke="#8A9BB5" stroke-opacity="0.3" stroke-dasharray="2 8"><circle cx="180" cy="180" r="176"/><circle cx="180" cy="180" r="120"/></g></svg>
      <img src="../logo/ico-red.svg" alt="" style="width: 200px; height: 200px; position: relative">
      <p style="margin: 0; position: relative; max-width: 380px; text-align: center; font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; line-height: 1.15">Toutes les routes mènent à l'arrivée.</p>
    </div>
    <span style="font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.18em; color: #8A9BB5">[.ICÔNE · ROTATION LENTE, 1 TOUR / 12 S]</span>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; justify-content: center; align-items: center; padding: 48px 32px; box-sizing: border-box">
    <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 24px">
      <div role="tablist" aria-label="Type d'accès" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 10px; background: #0C1424; border: 1px solid #22324D">
        <button type="button" role="tab" aria-selected="true" style="height: 44px; border: none; border-radius: 7px; background: #EEF2F7; color: #05070D; font-weight: 600; font-size: 15px">Connexion</button>
        <button type="button" role="tab" aria-selected="false" style="height: 44px; border: none; border-radius: 7px; background: transparent; color: #C9D3E1; font-weight: 500; font-size: 15px">Inscription</button>
      </div>
      <h1 style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 56px; line-height: 0.95; text-transform: uppercase">Bon <em style="font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-style: italic; text-transform: none">retour</em></h1>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button type="button" style="height: 52px; border-radius: 8px; border: 1px solid #22324D; background: #0C1424; color: #EEF2F7; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 15px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-4 1.5-4-2-6-2.5M15 21v-3.5a3 3 0 0 0-1-2.5c3 0 6-1.5 6-6.5a5 5 0 0 0-1.5-3.5 4.5 4.5 0 0 0 0-3.5s-1.2-.4-3.8 1.4a13 13 0 0 0-7 0C5.2 1.6 4 2 4 2a4.5 4.5 0 0 0 0 3.5A5 5 0 0 0 2.5 9c0 5 3 6.5 6 6.5a3 3 0 0 0-1 2.5V21"/></svg>GitHub</button>
        <button type="button" style="height: 52px; border-radius: 8px; border: 1px solid #22324D; background: #0C1424; color: #EEF2F7; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 15px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 17c-2 0-4-1-5-2 0-5 1.5-9 3.5-11 1.5-.6 3-.9 4-1l.5 1.2a14 14 0 0 1 2 0L13.5 3c1 .1 2.5.4 4 1 2 2 3.5 6 3.5 11-1 1-3 2-5 2l-1-2M8 17l1-2"/><circle cx="9" cy="11.5" r="1"/><circle cx="15" cy="11.5" r="1"/></svg>Discord</button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.2em; color: #8A9BB5"><i style="flex-grow: 1; height: 1px; background: #22324D"></i>OU AVEC UN NOM D'UTILISATEUR<i style="flex-grow: 1; height: 1px; background: #22324D"></i></div>

      <form style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="user" style="font-size: 14px; font-weight: 500">Nom d'utilisateur</label>
          <input id="user" value="phil.m" autocomplete="username" style="height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 8px; border: 1px solid #22324D; background: #0C1424; color: #EEF2F7; font-size: 16px">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="pass" style="font-size: 14px; font-weight: 500">Mot de passe</label>
          <div style="position: relative">
            <input id="pass" type="password" value="motdepasse" autocomplete="current-password" style="width: 100%; height: 52px; box-sizing: border-box; padding: 0 56px 0 16px; border-radius: 8px; border: 1px solid #5BD6FF; background: #0C1424; color: #EEF2F7; font-size: 16px; outline: 3px solid rgba(91, 214, 255, 0.25)">
            <button type="button" aria-label="Afficher le mot de passe" style="position: absolute; right: 4px; top: 4px; width: 44px; height: 44px; border: none; background: transparent; color: #8A9BB5; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #D41F27">Se souvenir de moi pendant 30 jours</label>
        <button type="submit" style="height: 56px; border: none; border-radius: 8px; background: #D41F27; color: #FFFFFF; font-weight: 600; font-size: 16px">Se connecter</button>
      </form>

      <p style="margin: 0; font-size: 13px; line-height: 1.55; color: #8A9BB5">Aucun courriel n'est demandé ni conservé. Mot de passe oublié : demande à ton enseignant de recréer ton compte.</p>
      <a href="03-invite.html" style="font-size: 15px; text-decoration: underline; text-underline-offset: 4px">Jouer sans compte, comme invité</a>
    </div>
  </main>
</div>
</body>
</html>
