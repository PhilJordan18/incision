<!doctype html>
<html lang="fr">
<head>

<title>Incision · Compte à rebours</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&amp;family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">

<body>

<div style="min-height: 900px; position: relative; overflow: hidden; background: radial-gradient(ellipse 40% 45% at 50% 42%, rgba(188, 4, 4, 0.3), rgba(5, 7, 13, 0) 70%), #05070D; color: #EEF2F7; font-family: Geist, 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 28px 32px 48px; box-sizing: border-box; gap: 28px">
  <div style="width: 100%; max-width: 1344px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-family: 'Geist Mono', monospace; font-size: 12px; letter-spacing: 0.18em; color: #8A9BB5">
    <span>[.SALLE 4B] [.ENTRAÎNEMENT] [.FRAPPE LIBRE]</span>
    <span>[.RÉGLAGES VERROUILLÉS]</span>
  </div>

  <div style="position: relative; width: 420px; max-width: 100%; height: 420px; display: grid; place-items: center">
    <img src="../logo/ico-red.svg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.22; transform: rotate(-24deg)">
    <svg width="420" height="420" viewBox="0 0 420 420" fill="none" aria-hidden="true" style="position: absolute; inset: 0; max-width: 100%"><circle cx="210" cy="210" r="200" stroke="#22324D" stroke-width="4"/><circle cx="210" cy="210" r="200" stroke="#EB3B44" stroke-width="4" stroke-linecap="round" stroke-dasharray="754 1257" transform="rotate(-90 210 210)"/></svg>
    <span role="timer" aria-live="assertive" style="position: relative; font-family: 'Big Shoulders Display', sans-serif; font-weight: 900; font-size: 300px; line-height: 0.8">3</span>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
    <span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 38px">Place tes doigts. La route s'ouvre.</span>
    <span style="font-size: 15px; color: #8A9BB5">La saisie s'active à « Partez ». Un tic par seconde, si le son est activé.</span>
  </div>

  <div style="width: 100%; max-width: 900px; padding: 20px 24px; border-radius: 12px; border: 1px solid #16233A; background: rgba(12, 20, 36, 0.7); font-family: 'Geist Mono', monospace; font-size: 22px; line-height: 2; color: #6B7C96">La mer était calme ce matin-là, et pourtant l'équipage savait que la traversée serait longue…</div>

  <div style="display: flex; gap: 18px; font-family: 'Geist Mono', monospace; font-size: 13px; letter-spacing: 0.18em; color: #8A9BB5">
    <span style="color: #6B7C96">5</span><span style="color: #6B7C96">4</span><span style="color: #EEF2F7">3</span><span>2</span><span>1</span><span style="color: #EB3B44">PARTEZ</span>
