services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incision
      POSTGRES_USER: incision
      POSTGRES_PASSWORD: ${INCISION_DB_PASSWORD:?Copier .env.example vers .env avant de lancer Docker Compose}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - incision_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U incision -d incision']
      interval: 5s
      timeout: 3s
      retries: 10

  # Disposable server for `npm run test:db -w @incision/database`; data lives in memory only.
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: incision_test
      POSTGRES_PASSWORD: incision_test_only
      POSTGRES_DB: postgres
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U incision_test -d postgres']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  incision_postgres_data:
